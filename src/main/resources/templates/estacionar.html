<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estacionar - Proyecto Oracle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Encabezado -->
    <header class="bg-primary text-white text-center py-3">
        <h1>Bienvenido al Sistema de Administración</h1>
    </header>

    <!-- Barra de navegación con botones -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid justify-content-center">
            <div class="navbar-nav">
                <a class="nav-link btn btn-outline-light mx-2" th:href="@{/index}">Inicio</a>
                <a class="nav-link btn btn-outline-light mx-2 active" th:href="@{/estacionar}">Estacionar</a>
                <a class="nav-link btn btn-outline-light mx-2" th:href="@{/visualizar}">Visualizar</a>
                <a class="nav-link btn btn-outline-light mx-2" th:href="@{/salir}">Salir</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-5">
        <p class="text-center fs-4">Tabla de Estacionamiento</p>
        <p class="text-center">Selecciona una opción del menú para continuar.</p>

        <!-- Botón para abrir modal -->
        <section class="py-4 mb-4 bg-light">
            <div class="container">
                <div class="row">
                    <div class="col-md-3">
                        <button type="button" class="btn btn-primary btn-block" data-bs-toggle="modal" data-bs-target="#estacionarse">
                            <i class="fas fa-plus"></i> Estacionarse
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Modal Estacionarse -->
        <div class="modal fade" id="estacionarse" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-md">
                <div class="modal-content">
                    <div class="modal-header bg-info text-white">
                        <h5 class="modal-title">Formulario de Estacionamiento</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/ticket/guardar}" th:object="${ticket}" method="POST" class="was-validated">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="nombre">Nombre</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required />
                            </div>
                            <div class="mb-3">
                                <label for="numero">Número</label>
                                <input type="text" class="form-control" th:field="*{numero}" required />
                            </div>
                            <div class="mb-3">
                                <label for="email">Email</label>
                                <input type="email" class="form-control" th:field="*{email}" required />
                            </div>
                            <div class="mb-3">
                                <label for="estacionamiento">Estacionamiento</label>
                                <select class="form-select" th:field="*{estacionamiento}" required>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="bloque">Bloque o Número del campo</label>
                                <input type="text" class="form-control" th:field="*{bloque}" required />
                            </div>
                            <div class="mb-3">
                                <label for="horaEntrada">Hora de Entrada</label>
                                <input type="datetime-local" class="form-control" th:field="*{horaEntrada}" required />
                            </div>
                            <div class="mb-3">
                                <label for="horaSalida">Hora de Salida</label>
                                <input type="datetime-local" class="form-control" th:field="*{horaSalida}" required />
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-primary" type="submit">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabla de Tickets -->
        <div class="container mt-4">
            <div class="card">
                <div class="card-header bg-dark text-white">
                    <h5>Tickets Registrados</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-secondary">
                            <tr>
                                <th># Ticket</th>
                                <th>Nombre</th>
                                <th>Número</th>
                                <th>Email</th>
                                <th>Estacionamiento</th>
                                <th>Bloque</th>
                                <th>Hora Entrada</th>
                                <th>Hora Salida</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ticket : ${tickets}">
                                <td th:text="${ticket.id}"></td>
                                <td th:text="${ticket.nombre}"></td>
                                <td th:text="${ticket.numero}"></td>
                                <td th:text="${ticket.email}"></td>
                                <td th:text="${ticket.estacionamiento}"></td>
                                <td th:text="${ticket.bloque}"></td>
                                <td th:text="${#dates.format(ticket.horaEntrada, 'yyyy-MM-dd HH:mm')}"></td>
                                <td th:text="${#dates.format(ticket.horaSalida, 'yyyy-MM-dd HH:mm')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
