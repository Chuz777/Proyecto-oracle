<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Vehículo</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>Nuevo Vehículo</h1>
    <form action="/vehiculos/guardar" method="post">
        <div class="form-group">
            <label for="numeroPlaca">Número de Placa:</label>
            <input type="text" id="numeroPlaca" name="numeroPlaca" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="tipoVehiculo">Tipo de Vehículo:</label>
            <input type="text" id="tipoVehiculo" name="tipoVehiculo" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="tipoEnergia">Tipo de Energía:</label>
            <input type="text" id="tipoEnergia" name="tipoEnergia" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="clienteId">ID del Cliente:</label>
            <input type="number" id="clienteId" name="clienteId" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Guardar Vehículo</button>

</form>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $('#vehiculoForm').on('submit', function(event) {
            event.preventDefault();
            $.ajax({
                url: '/vehiculos/guardar',
                type: 'POST',
                data: $(this).serialize(),
                success: function(response) {
                    alert('Vehículo guardado con éxito');
                    location.reload();
                },
                error: function(error) {
                    alert('Error al guardar el vehículo');
                }
            });
        });
    </script>
</body>
</html>
