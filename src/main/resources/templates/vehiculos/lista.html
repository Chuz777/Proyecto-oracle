<title>Lista de Vehículos</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>Lista de Vehículos</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Número de Placa</th>
                <th>Tipo de Vehículo</th>
                <th>Tipo de Energía</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="vehiculo : ${vehiculos}">
                <td th:text="${vehiculo.idVehiculo}"></td>
                <td th:text="${vehiculo.cliente.nombre}"></td>
                <td th:text="${vehiculo.numeroPlaca}"></td>
                <td th:text="${vehiculo.tipoVehiculo}"></td>
                <td th:text="${vehiculo.tipoEnergia}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
